# Build the macOS (.bundle) version of "3DE4 Lens Distortion" on a GitHub
# Actions Mac runner.
#
# The AE SDK is not kept in the repository tree (the SDK license forbids open
# redistribution). The build-only subset (Examples/Headers, Examples/Resources,
# Examples/Util zipped as AfterEffectsSDK_26.5_mac.zip) lives in the PRIVATE
# repository comkoff/ae-sdk, release AE-SDK-26.5-mac. This workflow downloads
# it with the SDK_TOKEN secret — a fine-grained personal access token with
# read-only "Contents" access to comkoff/ae-sdk.

name: build-mac

on:
  push:
    branches: [main, master]
    paths:
      - "ae_ldpk/**"
      - "ldpk-2.14.0/include/**"
      - ".github/workflows/build-mac.yml"
      - "!**/*.md" # docs do not affect the build; macOS minutes are 10x quota
  workflow_dispatch:

permissions:
  contents: read

env:
  SDK_REPO: comkoff/ae-sdk
  SDK_RELEASE: AE-SDK-26.5-mac
  SDK_ASSET: AfterEffectsSDK_26.5_mac.zip

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download the AE SDK (macOS) from the private SDK repository
        env:
          GH_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          gh release download "$SDK_RELEASE" \
            --repo "$SDK_REPO" --pattern "$SDK_ASSET" \
            --output "$RUNNER_TEMP/aesdk.zip"
          mkdir -p "$RUNNER_TEMP/aesdk"
          unzip -q "$RUNNER_TEMP/aesdk.zip" -d "$RUNNER_TEMP/aesdk"
          AECONFIG="$(find "$RUNNER_TEMP/aesdk" -name AEConfig.h | head -1)"
          if [ -z "$AECONFIG" ]; then
            echo "::error::AEConfig.h not found in the SDK zip"
            exit 1
          fi
          echo "AE_SDK_HEADERS=$(cd "$(dirname "$AECONFIG")" && pwd)" >> "$GITHUB_ENV"

      - name: Build release
        run: bash ae_ldpk/ae/Mac/build_mac.sh release

      - name: Build debug (diagnostic log)
        run: bash ae_ldpk/ae/Mac/build_mac.sh debug

      - uses: actions/upload-artifact@v4
        with:
          name: LD_3DE4_Lens_Distortion_mac
          path: releases/AE_LD3DE4/**/*.bundle
          if-no-files-found: error
